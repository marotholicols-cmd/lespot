<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  *{box-sizing:border-box} body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0}
  header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900;font-size:18px}
  .wrap{max-width:500px;margin:0 auto;padding:16px}
  .card{background:#1e1e1e;border:1px solid #333;padding:18px;border-radius:16px}
  label{font-size:13px;opacity:.7;display:block;margin:12px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:15px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#d4ff3f;color:#000;font-weight:900;font-size:16px;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.5}
  #msg{margin-top:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;text-align:center}
  .back{display:block;text-align:center;color:#fff;opacity:.7;margin-top:14px;text-decoration:none;font-size:13px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:12px}
  .nav a{color:#fff;text-decoration:none;font-size:13px;opacity:.7} .nav a.active{opacity:1;color:#d4ff3f}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — UPLOAD</header>
<div class="wrap">
  <div class="card">
    <label>Song Title</label>
    <input id="title" placeholder="e.g. Test">
    <label>Artist Name</label>
    <input id="artist" placeholder="e.g. FlackoBird">
    <label>Price in Grind (G) — e.g. 0.2</label>
    <input id="price" type="number" step="0.01" placeholder="0.2">
    <label>Cover Image (optional)</label>
    <input id="cover" type="file" accept="image/*">
    <label>Audio File — MP3</label>
    <input id="audio" type="file" accept="audio/*">
    <button id="btn" onclick="doUpload()">UPLOAD SONG →</button>
    <div id="msg"></div>
  </div>
  <a class="back" href="discover.html">← Back to Discover</a>
</div>
<div class="nav"><a href="discover.html">Discover</a><a href="library.html">Library</a><a href="upload.html" class="active">Upload</a><a href="wallet.html">Wallet</a></div>

<script>
async function doUpload(){
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const say = (t)=> msg.textContent = t;

  const title = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();
  const priceVal = document.getElementById('price').value;
  const audioFile = document.getElementById('audio').files[0];
  const coverFile = document.getElementById('cover').files[0];

  if(!title || !artist){ say("Fill title + artist"); return; }
    if(!audioFile){ say("Pick an MP3 file first"); return; }
  if(!audioFile.type.startsWith('audio/')){
    say("❌ That file is NOT music! You picked a " + audioFile.type + " (probably a picture).\n\nPlease pick a file that ends with .mp3");
    btn.disabled = false;
    return;
  }
  if(!audioFile.name.toLowerCase().endsWith('.mp3')){
    say("❌ Please pick a .mp3 file, not " + audioFile.name);
    btn.disabled = false;
    return;
  }
  if(!priceVal){ say("Enter a price, e.g. 0.2"); return; }

  btn.disabled = true;
  say("Checking login...");
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ say("Not logged in. Go to auth.html first."); btn.disabled=false; return; }

  try{
    // 1. Upload audio to Storage bucket 'songs'
    say("Uploading audio... please wait, do not close.");
    const cleanName = audioFile.name.replace(/[^a-zA-Z0-9.-]/g,'_');
    const audioPath = user.id + "/" + Date.now() + "_" + cleanName;
    const { error: upErr } = await sb.storage.from('songs').upload(audioPath, audioFile);
    if(upErr) throw new Error("Storage upload failed: " + upErr.message + "\n\nCheck: Supabase > Storage > songs bucket exists and is PUBLIC.");

    // 2. Upload cover if any
    let coverPath = null;
    if(coverFile){
      const cName = coverFile.name.replace(/[^a-zA-Z0-9.-]/g,'_');
      coverPath = user.id + "/" + Date.now() + "_cover_" + cName;
      await sb.storage.from('songs').upload(coverPath, coverFile);
    }

    // 3. Insert — ONLY columns that exist!
    say("Saving song info...");
    const { error: dbErr } = await sb.from('songs').insert({
      title: title,
      artist_name: artist,
      artist_id: user.id,
      audio_path: audioPath,
      price_grind: parseFloat(priceVal)
      // DO NOT send price_maloti (generated) or cover_path (doesn't exist)
    });
    if(dbErr) throw dbErr;

    say("✅ UPLOADED! Go to Discover to see it.");
    setTimeout(()=> location.href = 'discover.html', 1200);

  }catch(e){
    console.error(e);
    say("FAILED: " + e.message);
    btn.disabled = false;
  }
}
</script>
</body>
</html>
