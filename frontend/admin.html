<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  *{box-sizing:border-box}
  body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0}
  header{background:#111;border-bottom:2px solid #d4ff3f;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
  header b{font-size:18px} header b span{color:#d4ff3f}
  header a{color:#fff;text-decoration:none;font-size:13px;opacity:.8}
  .wrap{padding:16px;max-width:800px;margin:0 auto}
  .status{background:#222;border:1px solid #333;padding:12px;border-radius:12px;margin-bottom:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .status.ok{border-color:#2ecc71} .status.err{border-color:#ff5252}
  h2{margin:22px 0 10px;font-size:18px} h2 span{color:#d4ff3f}
  .card{background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:14px;margin-bottom:12px}
  .muted{opacity:.7;font-size:13px;line-height:1.6;word-break:break-word}
  button{border:0;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;margin-right:8px;margin-top:10px;font-size:14px}
  .approve{background:#d4ff3f;color:#000} .reject{background:#444;color:#fff} .refresh{background:#fff;color:#000;width:100%;margin:16px 0 0}
  .tabs{display:flex;gap:8px;margin:14px 0} .tabs button{background:#222;color:#fff;border:1px solid #333} .tabs button.active{background:#d4ff3f;color:#000}
</style>
</head>
<body>
<header><b>MAROTHOLI <span>LES-POT</span> — ADMIN</b><a href="discover.html">← Back to App</a></header>
<div class="wrap">
  <div id="status" class="status">Loading admin...</div>
  <div id="adminContent" style="display:none">
    <div class="tabs">
      <button id="tabP" class="active" onclick="showTab('purchases')">Purchases</button>
      <button id="tabW" onclick="showTab('withdrawals')">Withdrawals</button>
      <button id="tabS" onclick="showTab('songs')">All Songs</button>
    </div>
    <div id="section-purchases"><h2>Pending <span>Purchases</span></h2><div id="purchases">Loading...</div></div>
    <div id="section-withdrawals" style="display:none"><h2>Pending <span>Withdrawals</span></h2><div id="withdrawals">Loading...</div></div>
    <div id="section-songs" style="display:none"><h2>All <span>Songs</span></h2><div id="songs">Loading...</div></div>
    <button class="refresh" onclick="init(true)">🔄 Refresh</button>
  </div>
</div>
<script>
function setStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}
function showTab(name){
  document.getElementById('section-purchases').style.display = name==='purchases' ? 'block' : 'none';
  document.getElementById('section-withdrawals').style.display = name==='withdrawals' ? 'block' : 'none';
  document.getElementById('section-songs').style.display = name==='songs' ? 'block' : 'none';
  document.getElementById('tabP').className = name==='purchases' ? 'active' : '';
  document.getElementById('tabW').className = name==='withdrawals' ? 'active' : '';
  document.getElementById('tabS').className = name==='songs' ? 'active' : '';
}
async function init(isRefresh){
  if(typeof sb === 'undefined'){
    setStatus("ERROR: sb not found. app.js did not load. Check that app.js is in same folder as admin.html", "err");
    return;
  }
  if(!isRefresh) setStatus("Checking login...");
  try{
      const { data: { user } } = await sb.auth.getUser();
    if(!user){ 
      setStatus("Not logged in.\n\nPlease login first, then open admin.html again.", "err");
      setTimeout(()=> location.href = 'auth.html', 1500);
      return;
    }
    setStatus("Logged in as " + user.email + "\nChecking if you are admin...");
    const { data: profile, error: profErr } = await sb.from('profiles').select('is_admin, email').eq('id', user.id).single();
    if(profErr){
      setStatus("Profile error: " + profErr.message + "\n\nRun in Supabase SQL:\nUPDATE profiles SET is_admin=true WHERE email='" + user.email + "'", "err");
      return;
    }
    if(!profile?.is_admin){
      setStatus("ACCESS DENIED\n\nLogged in as: " + user.email + "\nOnly the owner can view this page.\n\nIf this is you, run in Supabase SQL:\nUPDATE profiles SET is_admin=true WHERE email='" + user.email + "'", "err");
      return;
    }
    setStatus("✅ Logged in as OWNER: " + user.email + "\nLoading data...", "ok");
    document.getElementById('adminContent').style.display = 'block';
    await Promise.all([loadPurchases(), loadWithdrawals(), loadSongs()]);
    setStatus("✅ Admin ready — Owner: " + user.email, "ok");
  }catch(e){
    console.error(e);
    setStatus("JS CRASH: " + e.message, "err");
  }
}
async function loadPurchases(){
  const el = document.getElementById('purchases');
  el.innerHTML = "Loading...";
  const { data, error } = await sb.from('purchases').select('*, songs(title, artist_name)').eq('status','pending').order('created_at',{ascending:false});
  if(error){ el.innerHTML = "Error: " + error.message; return; }
  if(!data || !data.length){ el.innerHTML = "<div class='card'>No pending purchases. All clear ✅<br><span class='muted'>This is normal right now — we deleted the fake song, so there is nothing to approve.</span></div>"; return; }
  el.innerHTML = data.map(p => `
    <div class="card">
      <b>${p.songs?.title || 'Unknown Song'}</b> — ${p.songs?.artist_name || ''}<br>
      <div class="muted">Purchase ID: ${p.id}<br>Song ID: ${p.song_id}<br>Buyer: ${p.fan_id || p.buyer_id || p.user_id || 'unknown'}<br>Ref: ${p.reference || p.tx_ref || p.otp || '-'}<br>Amount: ${p.amount || p.price_grind || '-'} • Method: ${p.payment_method || p.method || '-'}<br>Date: ${p.created_at || ''}</div>
      <button class="approve" onclick="approveBuy('${p.id}')">✅ APPROVE & UNLOCK</button>
      <button class="reject" onclick="rejectBuy('${p.id}')">Reject</button>
    </div>`).join('');
}
async function loadWithdrawals(){
  const el = document.getElementById('withdrawals');
  el.innerHTML = "Loading...";
  const { data, error } = await sb.from('withdrawals').select('*').eq('status','pending').order('created_at',{ascending:false});
  if(error){ el.innerHTML = "Withdrawals table not found or error: " + error.message; return; }
  if(!data || !data.length){ el.innerHTML = "<div class='card'>No pending withdrawals. All clear ✅</div>"; return; }
  el.innerHTML = data.map(w => `
    <div class="card"><b>${w.amount || ''} — ${w.method || w.payment_method || ''}</b><br>
    <div class="muted">ID: ${w.id}<br>Artist: ${w.artist_id || w.user_id || ''}<br>Details: ${w.phone || w.account || w.details || ''}<br>Date: ${w.created_at || ''}</div>
    <button class="approve" onclick="approveW('${w.id}')">✅ APPROVE PAID</button>
    <button class="reject" onclick="rejectW('${w.id}')">Reject</button></div>`).join('');
}
async function loadSongs(){
  const el = document.getElementById('songs');
  el.innerHTML = "Loading...";
  const { data, error } = await sb.from('songs').select('*').order('created_at',{ascending:false});
  if(error){ el.innerHTML = "Error: " + error.message; return; }
  if(!data || !data.length){ el.innerHTML = "<div class='card'>No songs yet.<br><span class='muted'>Upload a REAL song from upload.html — the old fake one was deleted.</span></div>"; return; }
  el.innerHTML = data.map(s => `
    <div class="card"><b>${s.title || 'Untitled'}</b> — ${s.artist_name || ''}<br>
    <div class="muted">ID: ${s.id}<br>audio_path: ${s.audio_path || 'MISSING - will not play!'}<br>Price: ${s.price_grind || s.price_maloti || ''}</div>
    <button class="reject" onclick="deleteSong('${s.id}')">Delete Song</button></div>`).join('');
}
async function approveBuy(id){
  if(!confirm("Approve this purchase and unlock the song?")) return;
  const { error } = await sb.from('purchases').update({ status: 'approved' }).eq('id', id);
  if(error) alert("Approve failed: " + error.message);
  else { await loadPurchases(); setStatus("✅ Purchase approved", "ok"); }
}
async function rejectBuy(id){
  if(!confirm("Reject this purchase?")) return;
  const { error } = await sb.from('purchases').update({ status: 'rejected' }).eq('id', id);
  if(error) alert(error.message); else loadPurchases();
}
async function approveW(id){
  const { error } = await sb.from('withdrawals').update({ status: 'approved' }).eq('id', id);
  if(error) alert(error.message); else loadWithdrawals();
}
async function rejectW(id){
  const { error } = await sb.from('withdrawals').update({ status: 'rejected' }).eq('id', id);
  if(error) alert(error.message); else loadWithdrawals();
}
async function deleteSong(id){
  if(!confirm("Delete this song?")) return;
  await sb.from('purchases').delete().eq('song_id', id);
  const { error } = await sb.from('songs').delete().eq('id', id);
  if(error) alert("Delete failed: " + error.message);
  else { loadSongs(); loadPurchases(); }
}
init();
</script>
</body>
</html>
