<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  *{box-sizing:border-box} body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif;margin:0;padding-bottom:140px}
  header{background:#d4ff3f;color:#000;padding:14px;text-align:center;font-weight:900}
  .wrap{max-width:600px;margin:0 auto;padding:16px}
  .card{background:#1e1e1e;border:1px solid #333;padding:14px;border-radius:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
  .info{flex:1} .info b{font-size:16px} .info div{font-size:13px;opacity:.7}
  .playBtn{background:#d4ff3f;color:#000;border:0;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer;white-space:nowrap}
  #msg{font-size:13px;opacity:.8;text-align:center;margin:10px;white-space:pre-wrap}
  #player{position:fixed;bottom:48px;left:0;right:0;background:#111;border-top:1px solid #333;padding:10px;text-align:center}
  #player audio{width:100%;max-width:600px}
  #nowPlaying{font-size:13px;margin-bottom:6px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:12px}
  .nav a{color:#fff;text-decoration:none;font-size:13px;opacity:.7} .nav a.active{opacity:1;color:#d4ff3f}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — LIBRARY</header>
<div class="wrap">
  <h2 style="margin:4px 0 2px">My Bought Songs</h2>
  <p style="opacity:.6;font-size:13px;margin:0 0 14px">Stream in app only. Song never leaves app.</p>
  <div id="list"></div>
  <div id="msg">Loading...</div>
</div>

<div id="player" style="display:none">
  <div id="nowPlaying"></div>
  <audio id="audio" controls controlsList="nodownload"></audio>
</div>

<div class="nav"><a href="discover.html">Discover</a><a href="library.html" class="active">Library</a><a href="upload.html">Upload</a><a href="wallet.html">Wallet</a></div>

<script>
async function load(){
  const msg = document.getElementById('msg');
  const list = document.getElementById('list');

  const { data: { user } } = await sb.auth.getUser();
  if(!user){ msg.textContent = "Not logged in. Go to auth.html"; return; }

  // FIXED: Only fetch MY purchases. Never fetch everyone else's.
  // Supabase filters on the server, so Alinah can never see other users' songs.
  const { data: purchases, error } = await sb.from('purchases')
    .select('*, songs(*)')
    .eq('status', 'approved')
    .eq('buyer_id', user.id) // <-- CHANGE THIS IF NEEDED: if your column is user_id, change buyer_id to user_id
    .order('created_at', { ascending: false });

  if(error){ msg.textContent = "Error: " + error.message; return; }

  console.log("My purchases:", purchases);
  console.log("My user id:", user.id);

  if(!purchases || purchases.length === 0){ msg.textContent = "No approved songs yet."; return; }

  msg.textContent = "";
  list.innerHTML = "";

  purchases.forEach(p => {
    const s = p.songs;
    if(!s) return;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div class="info"><b>${s.title}</b><div>${s.artist_name} • ${s.price_grind}G • APPROVED</div></div><button class="playBtn">▶ PLAY</button>`;
    div.querySelector('.playBtn').onclick = () => playSong(s);
    list.appendChild(div);
  });
}

async function playSong(song){
  const msg = document.getElementById('msg');
  const player = document.getElementById('player');
  const audio = document.getElementById('audio');
  const now = document.getElementById('nowPlaying');

  msg.textContent = "Getting play link for " + song.title + "...";
  now.textContent = "🎵 " + song.title + " — " + song.artist_name;
  player.style.display = 'block';

  // Signed URL works even if bucket is private
  let url = null;
  const { data: signed } = await sb.storage.from('songs').createSignedUrl(song.audio_path, 3600);
  if(signed) url = signed.signedUrl;

  if(!url){
    const { data: pub } = sb.storage.from('songs').getPublicUrl(song.audio_path);
    url = pub.publicUrl;
  }

  console.log("Playing URL:", url, "audio_path:", song.audio_path);
  audio.src = url;
  try{
    await audio.play();
    msg.textContent = "✅ Playing: " + song.title;
  }catch(e){
    msg.textContent = "Tap the Play button in the player below.\n" + e.message;
  }
}

load();
</script>
</body>
</html>
