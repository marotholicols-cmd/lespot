<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deposit - Marotholi Les-Pot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
*{box-sizing:border-box}body{background:#0f0f0f;color:#fff;font-family:system-ui;margin:0}
header{background:#d4ff3f;color:#000;padding:16px;text-align:center;font-weight:900}
.wrap{max-width:400px;margin:0 auto;padding:20px}
.card{background:#1e1e1e;border:1px solid #333;padding:20px;border-radius:16px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin-bottom:10px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#d4ff3f;font-weight:900;cursor:pointer}
.small{font-size:13px;opacity:.7;line-height:1.6}
a{color:#d4ff3f}
</style>
</head>
<body>
<header>MAROTHOLI LES-POT — DEPOSIT</header>
<div class="wrap">
<div class="card">
<h2>Top Up Wallet</h2>
<p class="small">1. Send money via M-PESA to <b>62674307</b> (Marotholi)<br>2. Copy the M-PESA OTP / Reference<br>3. Paste it below + amount in Grinds<br>1 Grind = M10 • Min 1 Grind</p>
<label>Amount in Grinds</label>
<input id="dAmt" type="number" placeholder="e.g. 3 = M30">
<label>Method</label>
<select id="dMethod"><option>M-PESA</option><option>EcoCash</option></select>
<label>M-PESA OTP / Reference</label>
<input id="dRef" placeholder="e.g. MP250...">
<button onclick="doDeposit()">Send Deposit for Approval</button>
<p class="small" id="dMsg"></p>
</div>
<div class="card" style="margin-top:14px"><h3>My Deposits</h3><div id="myDeposits">Loading...</div></div>
<a href="discover.html">← Back</a>
</div>
<script>
async function doDeposit(){
  const amt = document.getElementById('dAmt').value;
  const method = document.getElementById('dMethod').value;
  const ref = document.getElementById('dRef').value.trim();
  if(!amt || !ref){ document.getElementById('dMsg').textContent='Enter amount + reference'; return; }
  await submitDeposit(amt, method, ref);
}
document.addEventListener('DOMContentLoaded', async ()=>{
  const {user} = await getMyProfile();
  if(user) loadMyDeposits(user.id);
  else location.href='auth.html';
});
</script>
</body>
</html>
